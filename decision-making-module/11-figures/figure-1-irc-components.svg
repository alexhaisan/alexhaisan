<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Verdana, Geneva, sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#3d3d3d"/></marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#c0231f"/></marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1a1a1a">The model applied to my decision</text>

  <!-- boxes -->
  <rect x="375" y="100" width="230" height="74" rx="7" fill="#595959"/>
  <text x="490" y="128" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Action</text>
  <text x="490" y="151" text-anchor="middle" fill="#ffffff" font-size="12.5">Withdrew from Marshall Wace</text>

  <rect x="40" y="290" width="250" height="88" rx="7" fill="#595959"/>
  <text x="165" y="318" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Preferences</text>
  <text x="165" y="340" text-anchor="middle" fill="#ffffff" font-size="11.5">Security · ACA · worthwhile work</text>
  <text x="165" y="359" text-anchor="middle" fill="#ffffff" font-size="11.5">· career kept open</text>

  <rect x="690" y="290" width="250" height="88" rx="7" fill="#595959"/>
  <text x="815" y="318" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Expectations</text>
  <text x="815" y="341" text-anchor="middle" fill="#ffffff" font-size="12">&#8220;an £80,000 gap&#8221;</text>
  <text x="815" y="361" text-anchor="middle" fill="#ff908d" font-size="11.5">actual £37,898</text>

  <rect x="690" y="458" width="250" height="72" rx="7" fill="#595959"/>
  <text x="815" y="486" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Evidence</text>
  <text x="815" y="509" text-anchor="middle" fill="#ffffff" font-size="12.5">headline figures only</text>

  <!-- Preferences -> Action : held -->
  <line x1="258" y1="290" x2="382" y2="178" stroke="#3d3d3d" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="286" y="238" fill="#3d3d3d" font-size="11.5" font-style="italic">held</text>

  <!-- Expectations -> Action : FAILED -->
  <line x1="722" y1="290" x2="598" y2="178" stroke="#c0231f" stroke-width="2.4" marker-end="url(#ahr)"/>
  <text x="742" y="228" fill="#c0231f" font-size="12" font-weight="bold">this belief argued</text>
  <text x="742" y="245" fill="#c0231f" font-size="12" font-weight="bold">for taking the job</text>

  <!-- Preferences -> Evidence : FAILED -->
  <path d="M 236 378 Q 450 462 684 486" fill="none" stroke="#c0231f" stroke-width="2.4" marker-end="url(#ahr)"/>
  <text x="330" y="518" fill="#c0231f" font-size="12" font-weight="bold">search stopped at the headline</text>

  <!-- Evidence <-> Expectations -->
  <line x1="772" y1="458" x2="772" y2="384" stroke="#c0231f" stroke-width="2.4" marker-end="url(#ahr)"/>
  <line x1="858" y1="384" x2="858" y2="452" stroke="#3d3d3d" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="614" y="424" text-anchor="end" fill="#c0231f" font-size="12" font-weight="bold">wrong by £44,102</text>
  <line x1="622" y1="420" x2="762" y2="424" stroke="#c0231f" stroke-width="1.1" stroke-dasharray="3,3"/>

  <!-- two inputs with no box -->
  <path d="M 212 112 L 367 124" fill="none" stroke="#c0231f" stroke-width="2.6" stroke-dasharray="7,5" marker-end="url(#ahr)"/>
  <text x="40" y="86" fill="#c0231f" font-size="13" font-weight="bold">What actually moved me</text>
  <text x="40" y="106" fill="#c0231f" font-size="11.5">£27,000 tuition already spent</text>
  <text x="40" y="126" fill="#c0231f" font-size="11.5" font-style="italic">the model has no box for it</text>

  <path d="M 768 130 L 613 140" fill="none" stroke="#c0231f" stroke-width="2.6" stroke-dasharray="7,5" marker-end="url(#ahr)"/>
  <text x="940" y="86" text-anchor="end" fill="#c0231f" font-size="13" font-weight="bold">An option never generated</text>
  <text x="940" y="106" text-anchor="end" fill="#c0231f" font-size="11.5">deferral not raised with the firm</text>
  <text x="940" y="126" text-anchor="end" fill="#c0231f" font-size="11.5" font-style="italic">it surfaced only afterwards</text>

  <!-- key -->
  <line x1="40" y1="580" x2="82" y2="580" stroke="#3d3d3d" stroke-width="2.2"/>
  <text x="90" y="584" fill="#3d3d3d" font-size="11.5">a link the model needs, which held</text>
  <line x1="390" y1="580" x2="432" y2="580" stroke="#c0231f" stroke-width="2.4"/>
  <text x="440" y="584" fill="#c0231f" font-size="11.5">a link that failed</text>
  <line x1="610" y1="580" x2="652" y2="580" stroke="#c0231f" stroke-width="2.6" stroke-dasharray="7,5"/>
  <text x="660" y="584" fill="#c0231f" font-size="11.5">an input the model excludes</text>
</svg>
