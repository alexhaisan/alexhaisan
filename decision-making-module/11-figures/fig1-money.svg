<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Verdana, Geneva, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <defs>
    <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6d6d6"/><stop offset="55%" stop-color="#b2b2b2"/><stop offset="100%" stop-color="#919191"/>
    </linearGradient>
    <linearGradient id="rdg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d94a46"/><stop offset="55%" stop-color="#c00000"/><stop offset="100%" stop-color="#9c0000"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-25%" width="125%" height="170%">
      <feDropShadow dx="2" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">The pay gap I believed in and the one that exists</text>

  <!-- believed -->
  <rect x="250" y="76" width="610" height="58" rx="8" fill="url(#gy)" stroke="#6e6e6e" stroke-width="1.2" filter="url(#sh)"/>
  <text x="236" y="101" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111">What I believed</text>
  <text x="236" y="121" text-anchor="end" font-size="11" fill="#555">£120,000 against £38,000</text>
  <text x="555" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">£82,000</text>

  <!-- actual -->
  <rect x="250" y="168" width="282" height="58" rx="8" fill="url(#gy)" stroke="#6e6e6e" stroke-width="1.2" filter="url(#sh)"/>
  <rect x="532" y="168" width="328" height="58" rx="8" fill="url(#rdg)" stroke="#8a0000" stroke-width="1.2" filter="url(#sh)"/>
  <rect x="520" y="168" width="24" height="58" fill="url(#gy)" opacity="0"/>
  <text x="236" y="193" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111">What it is</text>
  <text x="236" y="213" text-anchor="end" font-size="11" fill="#555">after tax, NI, student loan</text>
  <text x="391" y="204" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">£37,898</text>
  <text x="696" y="195" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">£44,102 never arrives</text>
  <text x="696" y="214" text-anchor="middle" font-size="11" fill="#ffffff">54% of the headline gap</text>

  <text x="450" y="266" text-anchor="middle" font-size="11" font-style="italic" fill="#777">Bars to scale. 2026/27 England rates; Plan 5 student loan.</text>
</svg>
