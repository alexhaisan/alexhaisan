<svg xmlns="http://www.w3.org/2000/svg" width="820" height="292" viewBox="0 0 820 292" font-family="Verdana, Geneva, sans-serif">
  <rect width="820" height="292" fill="#ffffff"/>
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfcfcf"/><stop offset="55%" stop-color="#ababab"/><stop offset="100%" stop-color="#8b8b8b"/>
    </linearGradient>
    <filter id="sh" x="-6%" y="-10%" width="115%" height="128%">
      <feDropShadow dx="2" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="cp"><rect x="40" y="56" width="740" height="204" rx="10"/></clipPath>
  </defs>

  <text x="410" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">My preferences against both options</text>

  <rect x="40" y="56" width="740" height="204" rx="10" fill="#ffffff" filter="url(#sh)"/>
  <g clip-path="url(#cp)">
    <rect x="40" y="56" width="740" height="44" fill="url(#hd)"/>
    <rect x="40" y="140" width="740" height="40" fill="#f4f4f4"/>
    <rect x="40" y="220" width="740" height="40" fill="#f4f4f4"/>
    <g stroke="#d0d0d0" stroke-width="1">
      <line x1="40" y1="140" x2="780" y2="140"/><line x1="40" y1="180" x2="780" y2="180"/><line x1="40" y1="220" x2="780" y2="220"/>
    </g>
    <g stroke="#b5b5b5" stroke-width="1">
      <line x1="270" y1="56" x2="270" y2="260"/><line x1="530" y1="56" x2="530" y2="260"/>
    </g>
    <line x1="40" y1="100" x2="780" y2="100" stroke="#6e6e6e" stroke-width="1.2"/>
  </g>

  <text x="60"  y="84" font-size="13" font-weight="bold" fill="#111">Preference</text>
  <text x="400" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Marshall Wace</text>
  <text x="660" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">PwC</text>

  <g font-size="12.5" fill="#111">
    <text x="60"  y="126" font-weight="bold">Security</text>
    <text x="400" y="126" text-anchor="middle">+£37,898 net</text>
    <text x="660" y="126" text-anchor="middle">certain</text>
    <text x="60"  y="166" font-weight="bold">ACA</text>
    <text x="400" y="166" text-anchor="middle" fill="#c00000">only likely</text>
    <text x="660" y="166" text-anchor="middle">yes</text>
    <text x="60"  y="206" font-weight="bold">Worthwhile work</text>
    <text x="400" y="206" text-anchor="middle">yes</text>
    <text x="660" y="206" text-anchor="middle" fill="#c00000">no</text>
    <text x="60"  y="246" font-weight="bold">Career open</text>
    <text x="400" y="246" text-anchor="middle" fill="#c00000">niche</text>
    <text x="660" y="246" text-anchor="middle">portable</text>
  </g>

  <rect x="40" y="56" width="740" height="204" rx="10" fill="none" stroke="#6e6e6e" stroke-width="1.3"/>
</svg>
